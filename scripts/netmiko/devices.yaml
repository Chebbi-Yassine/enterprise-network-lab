# Inventaire des équipements réseau — enterprise-network-lab
#
# IMPORTANT (Packet Tracer limitation) :
# Ces IP correspondent au plan d'adressage du MASTER DESIGN, mais Netmiko ne
# pourra PAS se connecter à des équipements simulés dans Packet Tracer.
# Ce fichier est écrit pour cibler du vrai Cisco IOS (matériel réel ou
# Cisco DevNet Sandbox). Pour ce projet, la connexion sera validée via
# des tests avec mock plutôt qu'une vraie session SSH.
#
# Ne jamais committer de vrais mots de passe ici — en pratique on les
# lirait depuis une variable d'environnement (voir connect.py).

